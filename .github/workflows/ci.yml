name: CI

# Build and run the test suite on every push and pull request to the
# release (main) and integration (dev) branches.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15 # Sequoia image ships Xcode 16 (needed for Swift Testing)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Swift Testing (@Test / #expect) requires Xcode 16+. The app's
        # deployment target (macOS 14) is unaffected by the toolchain version.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        # Pinned so the strict gate is reproducible: a floating SwiftLint could
        # add or tighten a default rule and turn CI red on an unrelated PR.
        env:
          SWIFTLINT_VERSION: "0.65.0"
        run: |
          curl -sSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o /tmp/swiftlint.zip
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint (strict)
        # SwiftLint needs full Xcode's sourcekitd (selected above), not the
        # Command Line Tools. --strict fails the job on any violation, so a
        # noncompliant PR is blocked before the slower build/test step.
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          swiftlint lint --strict

      - name: Install SwiftFormat
        # Pinned for reproducibility, like SwiftLint.
        env:
          SWIFTFORMAT_VERSION: "0.62.0"
        run: |
          curl -sSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -oq /tmp/swiftformat.zip -d /tmp/swiftformat
          echo "/tmp/swiftformat" >> "$GITHUB_PATH"

      - name: SwiftFormat (lint)
        # Fails the job if any file isn't formatted per .swiftformat. SwiftFormat
        # parses Swift itself, so it needs no sourcekitd/DEVELOPER_DIR.
        run: swiftformat --lint .

      - name: String Catalog discipline
        # The one house rule with no toolchain behind it. Measured: with
        # extractionState "manual", xcstringstool sync walks past an entry whose
        # en value has drifted from the code — intact, no warning — and never
        # marks an orphan, so Xcode gives this catalog zero drift and zero orphan
        # detection. Pure stdlib Python, no install step, runs before the build
        # because a missing key is cheaper to find here than in a release.
        # The self-test runs first: a checker that silently stops checking reports
        # the same "clean" as one that works.
        run: |
          python3 scripts/check-catalog-selftest.py
          python3 scripts/check-catalog.py .

      - name: Build and test
        # The CI build is not code-signed (the runner has no signing identity), so
        # signing is disabled — otherwise xcodebuild would try to sign and fail.
        # Release builds are signed separately by scripts/release.sh.
        # The suite is unit-only and deterministic (injected clocks, mocked
        # sources), so it needs no real audio device, display, or Accessibility
        # permission and runs cleanly on a headless runner.
        # TEST_RUNNER_ vars cross into the app-hosted test process with the
        # prefix stripped. The wait budget is widened here because the runner's
        # 3-4 vCPUs fair-share one MainActor across the whole parallel suite:
        # measured, the same healthy waits that take microseconds locally took
        # ~6 s per test here once the suite grew past ~900 tests, and the local
        # 5 s budget turned starvation into false reds. The bound still exists —
        # a genuine wedge fails loud at 25 s instead of hanging to the job
        # timeout with no name attached.
        env:
          TEST_RUNNER_CREMA_TEST_WAIT_SECONDS: "25"
        # Tests run SERIALLY here, parallel everywhere else. The runner's 3-4
        # vCPUs cannot carry 115 parallel suites: the GCD global pool has a
        # per-QoS thread ceiling, the hang-modelling tests park real threads on
        # it by design, and every raced border read wants a slot — measured, a
        # press's pre-read queued behind the parked orphans for 75 s and the
        # write it feeds never started (writeStartCount == 0). Each parallel
        # run tripped a different timing landmine; serial removes the class.
        # The verdict is the "Test run with N tests" line, never xcodebuild's
        # exit: the app-hosted test host boots the real AppCore, whose pollers
        # hold the runloop, and its teardown can hang AFTER every test has
        # reported (documented in CLAUDE.md; measured here — a fully green run
        # sat mute from the verdict line to the 30-minute job timeout and was
        # reported "cancelled" with all tests passed). So the step watches the
        # log for the verdict, takes it, and only then kills the hung host.
        # A parked test never prints the verdict, so a genuine wedge still
        # fails — at the ceiling below, with the log's tail attached, instead
        # of at the job timeout with nothing.
        run: |
          xcodebuild test \
            -project Crema.xcodeproj \
            -scheme Crema \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > xcodebuild-test.log 2>&1 &
          XCB=$!
          tail -F xcodebuild-test.log & TAILER=$!
          finish() {
            kill "$TAILER" 2>/dev/null || true
          }
          trap finish EXIT
          for _ in $(seq 1 1200); do
            verdict=$(grep -m1 -E "Test run with [0-9]+ tests in [0-9]+ suites (passed|failed)" xcodebuild-test.log || true)
            if [ -n "$verdict" ]; then
              # Give xcodebuild a moment to exit on its own before ruling it hung.
              for _ in $(seq 1 20); do kill -0 "$XCB" 2>/dev/null || break; sleep 1; done
              if kill -0 "$XCB" 2>/dev/null; then
                echo "Verdict printed but the test host never exited — killing the hung teardown."
                kill "$XCB" 2>/dev/null || true; sleep 2; kill -9 "$XCB" 2>/dev/null || true
              fi
              echo "VERDICT: $verdict"
              case "$verdict" in
                *passed*) exit 0 ;;
                *) grep -E "✘" xcodebuild-test.log | tail -40; exit 1 ;;
              esac
            fi
            if ! kill -0 "$XCB" 2>/dev/null; then
              wait "$XCB"; status=$?
              echo "xcodebuild exited ($status) before any verdict line."
              tail -80 xcodebuild-test.log
              exit "$status"
            fi
            sleep 1
          done
          echo "No verdict within 20 minutes — a parked test, not a hung teardown."
          grep -E "Suite \w+ (passed|failed)" xcodebuild-test.log | tail -20
          exit 1

      - name: Release build, signed as the project says
        # Debug alone leaves the Sparkle updater outside the gate: its code is
        # behind `#if !DEBUG`, so only a Release build ever compiles it. Signing
        # is deliberately NOT disabled here — ad-hoc needs no identity, and
        # applying the project's real signing settings is the whole point of the
        # check below.
        run: |
          xcodebuild build \
            -project Crema.xcodeproj \
            -scheme Crema \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-release

      - name: Reject ad-hoc plus hardened runtime
        # dyld's library validation refuses a hardened-runtime process mapping a
        # non-platform library whose Team ID differs, and an ad-hoc (or
        # self-signed) signature has no Team at all — so this pairing yields an
        # app that aborts at launch loading Sparkle.framework, which is how it
        # once shipped broken (docs/DECISIONS.md: signed-without-hardened-runtime).
        # `codesign --verify` passes that exact bundle, because it checks
        # integrity and not load policy; the flag pairing, however, is right there
        # in the code directory. Cheap and deterministic, so it belongs here —
        # release.sh still launches the real artifact from the dmg, which is the
        # only way to catch load failures this check cannot name in advance.
        run: |
          APP=build-release/Build/Products/Release/Crema.app
          FLAGS=$(codesign -d --verbose=2 "$APP" 2>&1 | grep -oE 'flags=0x[0-9a-f]+\([^)]*\)' || true)
          echo "signature $FLAGS"
          if grep -q runtime <<<"$FLAGS" && grep -qE 'adhoc' <<<"$FLAGS"; then
            echo "::error file=Crema.xcodeproj/project.pbxproj::ENABLE_HARDENED_RUNTIME with an ad-hoc/self-signed identity: dyld will abort this app at launch on Sparkle.framework. Set ENABLE_HARDENED_RUNTIME = NO; release.sh adds --options runtime only on the Developer ID path, where a real Team ID satisfies library validation."
            exit 1
          fi
