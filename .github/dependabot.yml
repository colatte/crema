version: 2

# Every version this repository depends on is pinned on purpose — the actions
# below, the Sparkle package the project file carries (exact 2.9.4), and by hand
# the SwiftLint/SwiftFormat/Xcode versions in ci.yml — because a floating
# toolchain turns an unrelated PR red with nothing in its diff to explain it. The
# cost of pinning is that a pin nobody watches rots quietly: v4 of an action
# keeps working right up to the day its Node runtime is dropped from the runner
# image, and then CI fails for a reason that has nothing to do with the change
# under test. This is the watcher — it opens a PR when a pin falls behind, so
# raising one stays a decision instead of an incident.
#
# Both entries target `dev`: the default target is the default branch, and a
# bot cannot land on `main` between releases (docs/GITHUB.md §2).
#
# Scope: `github-actions` covers `uses:` references only; the linter and Xcode
# pins are plain env values, invisible to Dependabot, and stay a manual review.
# `swift` is a declared bet: the manifest is not a Package.swift but the Xcode
# project (pins at Crema.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
# Package.resolved), which Dependabot learned to read behind a feature flag
# (dependabot-core #14332, merged 2026-03-05) the documentation does not yet
# mention. The first PR it opens — or the first "no manifest found" under
# Insights → Dependency graph → Dependabot — decides whether the entry stays.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
