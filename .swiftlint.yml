# SwiftLint configuration for Crema.
#
# Run:  DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swiftlint
#       (the DEVELOPER_DIR is required — SwiftLint crashes loading sourcekitd
#        under CommandLineTools; it needs full Xcode.)
#       swiftlint --fix   autocorrects the fixable violations.
#
# SwiftFormat owns pure formatting (see .swiftformat, enforced by
# `swiftformat --lint .` in CI); SwiftLint here focuses on correctness and best
# practice. The two run side by side, so the formatting rules disabled below are
# left to SwiftFormat; the remaining opt-outs are disabled for behavior reasons
# noted per rule.

included:
  - Crema
  - CremaTests

excluded:
  - .build
  - DerivedData
  - ThirdParty # vendored third-party code — not ours to lint

# Default rules disabled deliberately for this codebase:
disabled_rules:
  - trailing_comma # SwiftFormat's trailingCommas adds them on wrapped collections;
    # this rule forbids them, so it's disabled to not fight the formatter
  - vertical_whitespace # blank-line collapsing now owned by SwiftFormat (consecutiveBlankLines)
  - optional_data_string_conversion # our String(decoding:as:) is a deliberate
    # lossy decode — the failable form would drop
    # a whole line on a stray byte (behavior change)

# 'Bool?' is used deliberately for tri-state (mute readback, playing state, ...),
# so discouraged_optional_boolean is intentionally not enabled. multiline_arguments
# is formatting and also not enabled.
opt_in_rules:
  - array_init
  # async_without_await was tried and removed (2026-07-31): 31 hits, every one a
  # conformance whose protocol forces `async` (isAvailable(), actuator commands,
  # their mocks) — zero real findings, and the rule cannot tell a forced signature
  # from a chosen one. The bug class it aimed at stays covered by review
  # (docs/DECISIONS.md: async-signature-is-not-a-suspension-point).
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  # modifier_order deliberately NOT enabled: modifier ordering is formatting,
  # owned by SwiftFormat's modifierOrder — the two disagree on nonisolated vs acl.
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - weak_delegate
  - yoda_condition

line_length:
  warning: 160 # accommodates long String(localized:) defaults + SwiftUI chains
  error: 200
  ignores_urls: true

identifier_name:
  # min_length is 2; these short names are whitelisted. Single letters are idiomatic
  # in geometry/index/color code: h/w, x/y/z, i/j/k/n, r/g/b. a/b are the A/B
  # test-screen fixtures; dx/dy are insetBy deltas; np is a now-playing local; id
  # and the to/on parameter labels round out the two-letter allowances.
  min_length: 2
  excluded: [id, a, b, g, r, h, w, x, y, z, i, j, k, n, dx, dy, np, to, on]

type_name:
  min_length: 3
  max_length:
    warning:
      50 # tech+capability names are deliberately descriptive/long
      # (e.g. CoreBrightnessKeyboardBrightnessController)

large_tuple:
  warning: 3 # 3-element tuples (RGB, (id, delay, continuation)) are fine

cyclomatic_complexity:
  warning: 15 # the Coordinator/suppressor state machines are inherently branchy

# Ceilings sized for this app's larger files. Coordinator.swift sits well past
# the 500 file_length warning and opts out inline via
# `// swiftlint:disable file_length`; WindowManagerTests opts out the same way (~500, grown by pinning fences).
# The Coordinator CLASS also opts out of type_body_length inline (scrub-grace round):
# priority and timers live only there by design, so its body grows with every
# presentation feature while pure decisions keep being extracted alongside.
file_length:
  warning: 500
  error: 1200
type_body_length:
  warning: 400
  error: 600

reporter: "xcode"
